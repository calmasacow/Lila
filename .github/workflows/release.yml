# Push a tag like v0.2.0 (matching project(Lila VERSION ...) in CMakeLists.txt) to build, test and publish the
# installer and latest.json as a GitHub release. Release.cmd does the same on your own machine.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, such as v0.2.0 (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check for an existing Windows installer
        id: existing
        shell: bash
        run: |
          if assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name') &&
            grep -Fxq "Lila-${TAG#v}-Setup.exe" <<< "$assets" &&
            grep -Fxq "files-${TAG#v}.json" <<< "$assets" &&
            grep -Fxq latest.json <<< "$assets"; then
            echo 'released=1' >> "$GITHUB_OUTPUT"
          else
            echo 'released=0' >> "$GITHUB_OUTPUT"
          fi

      - name: Check the tag matches the version
        if: steps.existing.outputs.released == '0'
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Lila VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG doesn't match CMakeLists.txt version $version" }

      - uses: actions/setup-python@v5
        if: steps.existing.outputs.released == '0'
        with:
          python-version: "3.14"

      - name: Python packages Lila bundles
        if: steps.existing.outputs.released == '0'
        run: python -m pip install numpy

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.existing.outputs.released == '0'

      - name: vcpkg cache
        if: steps.existing.outputs.released == '0'
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}

      - name: Configure
        if: steps.existing.outputs.released == '0'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          # vcpkg.json's builtin-baseline must be in the runner's vcpkg history.
          git -C $env:VCPKG_ROOT fetch --quiet origin
          $env:LILA_PYTHON_DIR = $env:pythonLocation
          cmake --preset windows

      - name: Build
        if: steps.existing.outputs.released == '0'
        run: cmake --build build --config Release

      - name: Test
        if: steps.existing.outputs.released == '0'
        run: ctest --test-dir build -C Release -j 4 -LE known_failing --output-on-failure

      - name: Installer
        if: steps.existing.outputs.released == '0'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:LILA_PYTHON_DIR = $env:pythonLocation
          & scripts\installer\build.ps1 -Config Release -Repository $env:GITHUB_REPOSITORY

      - name: Publish
        if: steps.existing.outputs.released == '0'
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          $assets = @("build-installer\Lila-$version-Setup.exe", "build-installer\latest.json", "build-installer\files-$version.json") + @(Get-ChildItem "build-installer\Lila-$version-Patch-*.exe" | ForEach-Object FullName)
          if (gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null) {
            gh release upload $env:TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:TAG @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Lila $version" --generate-notes
          }

  linux:
    needs: release
    uses: ./.github/workflows/linux-packages.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
      publish: true
    permissions:
      contents: write
